<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OHTSL Game Finder</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Breadcrumb navigation -->
  <nav id="breadcrumb" class="breadcrumb">
    <span class="crumb active">All Seasons</span>
  </nav>

  <!-- Filter bar (hidden until season selected) -->
  <div id="filter-bar" class="filter-bar hidden">
    <div class="filter-group">
      <label for="zip-input">ZIP Code</label>
      <input type="text" id="zip-input" placeholder="e.g. 44122" maxlength="5" />
    </div>
    <div class="filter-group">
      <label for="radius-select">Radius</label>
      <select id="radius-select">
        <option value="0">All distances</option>
        <option value="10">10 miles</option>
        <option value="20" selected>20 miles</option>
        <option value="30">30 miles</option>
        <option value="40">40 miles</option>
        <option value="50">50 miles</option>
      </select>
    </div>
    <div class="filter-group">
      <label for="date-select">Game Date</label>
      <select id="date-select">
        <option value="">All dates</option>
      </select>
    </div>
    <button id="apply-filters" class="btn">Apply</button>
  </div>

  <!-- Season picker (shown when no season selected) -->
  <div id="season-picker" class="season-picker">
    <h2>Select a Season</h2>
    <div id="season-list" class="season-list"></div>
  </div>

  <!-- Map container -->
  <div id="map-container" class="map-container hidden">
    <div id="map"></div>
  </div>

  <!-- Game detail panel -->
  <div id="detail-panel" class="detail-panel hidden">
    <div class="detail-header">
      <h3 id="detail-title"></h3>
      <p id="detail-address" class="detail-address"></p>
      <button id="detail-close" class="btn-close">&times;</button>
    </div>
    <div id="detail-games" class="detail-games"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
