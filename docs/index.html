<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OHTSL Game Finder</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Breadcrumb navigation -->
  <nav id="breadcrumb" class="breadcrumb">
    <span class="crumb active">All Seasons</span>
  </nav>

  <!-- Filter bar (hidden until season selected) -->
  <div id="filter-bar" class="filter-bar hidden">
    <div class="filter-group">
      <label for="zip-input">ZIP / Location</label>
      <div class="zip-input-group">
        <input type="text" id="zip-input" placeholder="e.g. 44122" maxlength="5" />
        <button id="use-location-btn" class="btn btn-icon" title="Use current location">📍</button>
      </div>
    </div>
    <div class="filter-group">
      <label for="radius-select">Radius</label>
      <select id="radius-select">
        <option value="0">All distances</option>
        <option value="10">10 miles</option>
        <option value="20" selected>20 miles</option>
        <option value="30">30 miles</option>
        <option value="40">40 miles</option>
        <option value="50">50 miles</option>
      </select>
    </div>
    <div class="filter-group">
      <label for="date-select">Game Date</label>
      <select id="date-select">
        <option value="">All dates</option>
      </select>
    </div>
    <button id="apply-filters" class="btn">Apply</button>
    <button id="share-link-btn" class="btn btn-secondary" title="Copy shareable link to current view">🔗 Share</button>
  </div>

  <!-- Season picker (shown when no season selected) -->
  <div id="season-picker" class="season-picker">
    <h2>Select a Season</h2>
    <div id="season-list" class="season-list"></div>
  </div>

  <!-- View Toggle Tabs for Mobile -->
  <div id="view-toggle" class="view-toggle hidden">
    <button id="toggle-map-btn" class="toggle-btn active">Map View</button>
    <button id="toggle-list-btn" class="toggle-btn">List View (<span id="list-count-badge">0</span>)</button>
  </div>

  <!-- Main Content Layout (Map + Search Results Panel) -->
  <div id="main-content" class="main-content hidden">
    <!-- Map container -->
    <div id="map-container" class="map-container">
      <div id="map"></div>
    </div>

    <!-- Search Results Panel -->
    <div id="results-panel" class="results-panel">
      <div class="results-header">
        <div class="results-header-top">
          <h3 id="results-title">Matching Games</h3>
          <span id="results-count" class="results-count">0 games</span>
        </div>
        <div class="results-controls">
          <div class="sort-group">
            <label for="sort-select">Sort By</label>
            <select id="sort-select">
              <option value="time" selected>Start Time</option>
              <option value="location">Location</option>
              <option value="location_time">Location &rarr; Start Time</option>
              <option value="time_location">Start Time &rarr; Location</option>
            </select>
          </div>
          <label class="select-all-label">
            <input type="checkbox" id="select-all-results"> Select All Results
          </label>
        </div>
      </div>
      <div id="results-list" class="results-list"></div>
    </div>
  </div>

  <!-- Venue detail panel (when clicking a map pin) -->
  <div id="detail-panel" class="detail-panel hidden">
    <div class="detail-header">
      <div class="detail-header-main">
        <h3 id="detail-title"></h3>
        <p id="detail-address" class="detail-address"></p>
      </div>
      <div class="detail-header-actions">
        <label class="select-all-label"><input type="checkbox" id="select-all-venue-games"> Select All Venue</label>
        <button id="detail-close" class="btn-close">&times;</button>
      </div>
    </div>
    <div id="detail-games" class="detail-games"></div>
  </div>

  <!-- Floating selection bar -->
  <div id="selection-bar" class="selection-bar hidden">
    <span id="selection-count">0 games selected</span>
    <div class="selection-actions">
      <button id="generate-email-btn" class="btn btn-accent">Generate Assignor List</button>
      <button id="clear-selection-btn" class="btn btn-secondary">Clear</button>
    </div>
  </div>

  <!-- Email output modal -->
  <div id="email-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Formatted Assignor Game List</h3>
        <button id="modal-close" class="btn-close">&times;</button>
      </div>
      <div class="modal-body">
        <p class="modal-help">Copy and paste this list into your email reply to the assignor:</p>
        <textarea id="email-output" readonly rows="10"></textarea>
      </div>
      <div class="modal-footer">
        <button id="copy-email-btn" class="btn btn-accent">Copy to Clipboard</button>
        <button id="modal-dismiss" class="btn btn-secondary">Close</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
