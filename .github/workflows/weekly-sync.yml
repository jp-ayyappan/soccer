name: Weekly Schedule Sync

on:
  schedule:
    # Every Monday at 06:00 UTC (2:00 AM EST)
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Scrape latest OHTSL schedules and detect changes
        run: |
          python3 scrape_ohtsl.py

      - name: Upload Reschedule Reports Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reschedule-reports
          path: |
            **/reschedules/*.txt
            **/games_by_*.txt
          if-no-files-found: ignore

      - name: Build web application JSON site data
        run: |
          python3 build_site_data.py

      - name: Run unit test suite
        run: |
          python3 -m unittest discover tests
          node --test tests/test_app.js

      - name: Create Pull Request for Schedule Sync
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(schedule): weekly schedule sync & reschedule report [auto]"
          title: "chore(schedule): weekly schedule sync & reschedule report [auto]"
          body: |
            Automated weekly schedule sync & reschedule report generated by GitHub Actions.

            - Updated season games and venue location data.
            - Generated dated reschedule audit reports under `**/reschedules/`.
          branch: "auto/weekly-schedule-sync"
          delete-branch: true
          base: "main"

      - name: Merge Pull Request for Schedule Sync
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ steps.cpr.outputs.pull-request-number }} --squash --delete-branch --admin --repo ${{ github.repository }}
