name: Weekly Schedule Sync

on:
  schedule:
    # Every Monday at 06:00 UTC (2:00 AM EST)
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Scrape latest OHTSL schedules and detect changes
        run: |
          python3 scrape_ohtsl.py

      - name: Upload Reschedule Reports Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reschedule-reports
          path: |
            **/reschedules/*.txt
            **/games_by_*.txt
          if-no-files-found: ignore

      - name: Build web application JSON site data
        run: |
          python3 build_site_data.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --staged --quiet; then
            echo "No schedule changes detected."
          else
            git commit -m "Weekly schedule sync & reschedule report [auto]"
            git push
          fi
